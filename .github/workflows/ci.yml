name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: C++ tests (native, with sanitizers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake libjpeg-turbo8-dev libpng-dev libgtest-dev
      - run: cmake -S core -B core/build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build core/build -j 4
      - run: core/build/imgshrink_tests
      - run: cmake -S core -B core/build-asan -DCMAKE_BUILD_TYPE=Debug -DIMGSHRINK_SANITIZE=ON
      - run: cmake --build core/build-asan -j 4
      - run: core/build-asan/imgshrink_tests

  web:
    name: WebAssembly build and browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: ./scripts/build-wasm.sh
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: web/dist
